services:
  - type: web
    name: llm-analysis-quiz
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install chromium"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: PORT
        value: "8000"
      - key: EXPECTED_SECRET
        sync: false
      - key: STUDENT_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
